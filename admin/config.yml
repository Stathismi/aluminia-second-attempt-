# Decap CMS: the admin page at https://mitskas-koufomata.gr/admin
# Login goes through GitHub (Netlify OAuth provider). Every save is a commit to this repo,
# and Netlify republishes the site within 1-2 minutes.
backend:
  name: github
  repo: Stathismi/aluminia-second-attempt-
  branch: main
  commit_messages:
    create: "Νέο: {{collection}} {{slug}}"
    update: "Αλλαγή: {{collection}} {{slug}}"
    uploadMedia: "Φωτογραφία: {{path}}"

locale: gr
site_url: https://mitskas-koufomata.gr
display_url: https://mitskas-koufomata.gr
logo_url: /assets/favicon.svg

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: erga
    label: "Οι δουλειές μας (καρουζέλ)"
    editor: { preview: false }
    files:
      - name: gallery
        label: "Φωτογραφίες έργων"
        file: data/gallery.json
        format: json
        fields:
          - name: items
            label: "Φωτογραφίες"
            label_singular: "φωτογραφία"
            widget: list
            summary: "{{fields.title}} · {{fields.location}}"
            hint: "Η πρώτη φωτογραφία της λίστας εμφανίζεται πρώτη. Σύρετε για να αλλάξετε σειρά."
            fields:
              - { name: image, label: "Φωτογραφία", widget: image, hint: "Οριζόντια φωτογραφία, ιδανικά 1600×1000 ή μεγαλύτερη." }
              - { name: title, label: "Τίτλος", widget: string, hint: "π.χ. Συρόμενη επάλληλη σε μπαλκόνι" }
              - { name: location, label: "Περιοχή", widget: string, required: false, hint: "π.χ. Γιαννιτσά" }
              - { name: date, label: "Χρονιά", widget: string, required: false, hint: "π.χ. 2026" }

  - name: proionta
    label: "Προϊόντα και κωδικοί"
    editor: { preview: false }
    files:
      - name: products
        label: "Κατάλογος προϊόντων"
        file: data/products.json
        format: json
        fields:
          - name: items
            label: "Προϊόντα"
            label_singular: "προϊόν"
            widget: list
            summary: "{{fields.code}} · {{fields.name}}"
            fields:
              - { name: code, label: "Κωδικός", widget: string, hint: "π.χ. MK-SR-01" }
              - { name: name, label: "Όνομα", widget: string }
              - { name: category, label: "Κατηγορία", widget: string, hint: "Γράψτε ακριβώς το ίδιο όνομα για προϊόντα της ίδιας κατηγορίας (π.χ. Συρόμενα). Τα κουμπιά φίλτρων φτιάχνονται μόνα τους." }
              - { name: description, label: "Περιγραφή", widget: text, required: false }
              - { name: specs, label: "Χαρακτηριστικά", widget: list, required: false, field: { name: spec, label: "Χαρακτηριστικό", widget: string } }
              - { name: image, label: "Φωτογραφία (προαιρετικά)", widget: image, required: false }

  - name: stoixeia
    label: "Στοιχεία επιχείρησης"
    editor: { preview: false }
    files:
      - name: site
        label: "Τηλέφωνα, διεύθυνση, ωράριο"
        file: data/site.json
        format: json
        fields:
          - { name: business_name, label: "Επωνυμία", widget: string }
          - { name: tagline, label: "Σύντομη περιγραφή (κάτω από τον τίτλο)", widget: text }
          - { name: mobile, label: "Κινητό", widget: string }
          - { name: phone, label: "Σταθερό", widget: string, required: false }
          - { name: email, label: "Email", widget: string }
          - { name: address, label: "Διεύθυνση", widget: string }
          - { name: maps_url, label: "Σύνδεσμος Google Maps", widget: string, required: false }
          - { name: hours, label: "Ωράριο", widget: string }
          - { name: service_area, label: "Περιοχές εξυπηρέτησης", widget: string }
          - { name: facebook, label: "Facebook (σύνδεσμος)", widget: string, required: false }
          - { name: instagram, label: "Instagram (σύνδεσμος)", widget: string, required: false }
